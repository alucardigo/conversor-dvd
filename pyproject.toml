[project]
name = "conversor-dvd"
version = "1.0.0"
description = "Converte DVDs antigos (VIDEO_TS, ISO, DVD-VR, VCD, VOB) para MP4 ou AVI usando o FFmpeg"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
conversor-dvd = "conversor_dvd.cli:main"

[project.gui-scripts]
conversor-dvd-janela = "conversor_dvd.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integracao: usa ffmpeg e os discos de teste em tests/fixtures"]
